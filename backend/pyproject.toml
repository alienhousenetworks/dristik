[tool.poetry]
name = "dristik-backend"
version = "2.0.0"
description = "Dristik 2.0 FastAPI Enterprise Backend"
authors = ["Sayantan De <desayantan1947@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
sqlalchemy = "^2.0.28"
alembic = "^1.13.1"
httpx = "^0.27.0"
jinja2 = "^3.1.3"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.1.2"
playwright = "^1.42.0"
beautifulsoup4 = "^4.12.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
