services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    shm_size: '1gb'
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      PRODUCTION_DATA_INTEGRITY_MODE: ${PRODUCTION_DATA_INTEGRITY_MODE:-true}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to at least 32 characters}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:?Set a non-default SYSTEM_ADMIN_PASSWORD}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-admin@dristik.ai}
      AUTH_DATABASE_PATH: /app/data/dristik.db
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_FFMPEG_INSTALL: "1"
    volumes:
      - ./backend:/app
      - dristik-data:/app/data
      - hf-cache:/root/.cache/huggingface
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dristik-data:
  hf-cache:
